<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="将AVIF和WebP格式图片转换为JPG或PNG格式的在线工具">
    <meta name="keywords" content="AVIF转换,WebP转换,JPG转换,PNG转换,图片格式转换">
    <title>图片格式转换工具 (AVIF/WebP → JPG/PNG) - 天天发蛋糕的工具箱</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HYJXFSRHF5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-HYJXFSRHF5');
    </script>
</head>

<body>
    <!-- 页头由 assets/js/site-chrome.js 统一注入 -->
    <site-header></site-header>

    <!-- 主内容 -->
    <main class="container">
        <h1>图片格式转换工具</h1>

        <div class="card card--elevated converter-container">
            <div class="flex--column">
                <div class="form-group">
                    <label for="formatSelect">输出格式</label>
                    <select id="formatSelect" class="mt-2">
                        <option value="jpg">JPG</option>
                        <option value="png">PNG</option>
                    </select>
                </div>

                <div class="form-group mt-4">
                    <label for="fileInput">选择图片文件</label>
                    <input type="file" id="fileInput" class="mt-2" accept=".avif,.webp" multiple>
                    <p class="text-muted mt-1">支持格式：AVIF 和 WebP</p>
                </div>

                <div id="status" class="mt-3">就绪</div>

                <div class="progress-container mt-3">
                    <div class="progress"></div>
                </div>
            </div>

            <button id="downloadBtn" class="btn btn--primary hidden">下载全部图片</button>

            <div id="previewContainer" class="mt-5 grid"></div>
        </div>
    </main>

    <!-- 页脚由 assets/js/site-chrome.js 统一注入 -->
    <site-footer></site-footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="../../assets/js/webp-avif-2-jpg-png.js"></script>
    <!-- 站点共享页头/页脚注入 -->
    <script src="../../assets/js/site-chrome.js"></script>
</body>

</html>
